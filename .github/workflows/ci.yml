name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Architectural rules that a reviewer would otherwise have to remember:
      # provider leakage, bare process.env, and client code importing the server.
      - name: Boundaries
        run: bun run check:boundaries

      # A schema edit without a generated migration is the one failure that only
      # shows up in production, so fail the build on an uncommitted diff.
      - name: Migrations are up to date
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          bunx drizzle-kit generate
          git diff --exit-code --stat server/db/migrations
